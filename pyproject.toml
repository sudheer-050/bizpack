[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bizpack"
version = "0.1.2"
authors = [
    { name = "BizPack Contributors" }
]
description = "The Python toolkit for business & data analysts: zero-friction spreadsheet cleaning + intuitive business formulas."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["pandas", "data-cleaning", "business-analyst", "excel", "accounting", "analytics", "xlookup", "pareto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
    "pandas>=1.4.0",
    "numpy>=1.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black",
    "flake8"
]

[project.urls]
"Homepage" = "https://github.com/sudheer-050/bizpack"
"Bug Tracker" = "https://github.com/sudheer-050/bizpack/issues"

[tool.setuptools.packages.find]
include = ["bizpack*"]

